# Example site profile for a church running the 교회사랑넷 (church-love.net) CMS.
#
# Same shape as example.yaml, with the two fields that CMS needs: it serves
# every page from one script and addresses a board by an opaque page code, so
# each board carries the code the site uses for it.
#
# Deliberately generic: a fictional host and placeholder names (홍길동 is the
# Korean equivalent of "John Doe"). Copy it to describe a real site:
#
#   cp src/video_migrator/profiles/churchlove.yaml config/<yoursite>.yaml
#
# Anything under config/ is gitignored, so a real profile — which names real
# people — never enters the repository. A profile there cannot be registered in
# scrapers/SCRAPERS, so it names its software below instead.

site:
  board_url: https://example.org/main/sub.html
  # The profile whose scraper parses this site. Redundant here, since 'churchlove'
  # is itself registered; a profile under config/ needs it.
  scraper: churchlove

# How an upload is titled. See example.yaml for what each slot means; the date
# leads because the destination platform stamps its own upload date on a video
# and will not take the original one.
upload:
  title_template: "{date} | {service} | {title} | {artist}"
  date_format: "{year}.{month}.{day}"

# One entry per board. Order sets the CLI --board choices, and the first entry
# is the default. weekday is the day the service is held; a publish date one day
# later is treated as a late upload and pulled back onto it. Omit weekday for a
# board with no fixed day. page_code is how the site addresses the board; find it in the
# URL the site's own menu links to. creation_time is the time-of-day stamped
# into the media file; omit it to use midnight. Keep it quoted — bare 10:30:00
# is a YAML integer.
#
# service_name fills the {service} slot of an upload title, and service_template
# replaces it on a record naming which of the day's services it is. A praise
# board credits a performer rather than a preacher, so it empties both preacher
# lists to accept any name — empty is not the same as omitted, and emptying one
# alone only narrows the check to the other.
boards:
  - name: early_morning_prayer
    page_code: 10
    genre: Sermon
    creation_time: "05:30:00"
    service_name: 새벽예배
  - name: sunday_sermon
    page_code: 9
    weekday: sunday
    genre: Sermon
    creation_time: "10:30:00"
    service_name: 주일예배
    service_template: "주일 {part} 예배"
  - name: wednesday_prayer
    page_code: 11
    weekday: wednesday
    genre: Sermon
    service_name: 수요기도회
  - name: friday_prayer
    page_code: 12
    weekday: friday
    genre: Sermon
    creation_time: "19:30:00"
    service_name: 금요성령집회
  - name: special_sermon
    page_code: 13
    genre: Sermon
    service_name: 특별집회
  - name: charisma_praise
    page_code: 15
    weekday: sunday
    genre: Praise
    service_name: 워십 찬양
    valid_preacher_titles: []
    valid_preacher_prefixes: []
  - name: votive_song
    page_code: 16
    weekday: sunday
    genre: Praise
    service_name: 봉헌송
    valid_preacher_titles: []
    valid_preacher_prefixes: []
  - name: choir_praise
    page_code: 17
    weekday: sunday
    genre: Praise
    service_name: 성가대 찬양
    valid_preacher_titles: []
    valid_preacher_prefixes: []

normalize:
  # A service part recorded at the end of a preacher name describes the service,
  # not the person: it is stripped from the name and prefixed to the title, so
  # "홍길동 선교사_2부설교" becomes preacher "홍길동 선교사" and title "2부 - ...".
  # The one capture group is the part.
  preacher_service_pattern: '[_\s]*([123]부|영상)(?:설교|예배)?\s*$'

  # Markers naming which service of the day a title belongs to. A single Sunday
  # yields a first service, a second, and sometimes a video of one, so a date on
  # its own does not identify a service.
  service_parts: ["1부", "2부", "3부", "영상"]

  # Regex -> replacement, applied to every scraped title in the order listed.
  # Python re.sub syntax: \1 is a capture group. Runs before title_spacing_words.
  #
  # Single-quote both sides. In double quotes YAML would eat the backslashes.
  title_replacements:
    '^\]\s+': ''                 # Remove a leading "] "
    '^([^\[]*\])': '[\1'         # Add the missing "[" when only "]" is present
    '^([^(]*\))': '(\1'          # Add the missing "(" when only ")" is present
    '\]제': '] 제'                # Put a space between "]" and 제
    '제\s*(\d+)\s*장': '제\1장'    # Close up "제 3 장" -> "제3장"

  # Regex -> replacement, applied to every scraped bible verse. Site typos in the
  # book name belong here; the generic tidying (unwrapping brackets, collapsing
  # spaces) is built in and runs afterwards.
  bible_verse_replacements:
    '\bJhon\b': 'John'          # the site misspells John in one record

  # A scraped artist name must carry one of these, or validation warns. Korean
  # titles follow the name; a trailing "(home church)" is ignored when looking.
  valid_preacher_titles: [" 목사", " 협동목사", " 선교사", " 장로", " 교수", " 총장", " M.D."]

  # English titles come before the name instead. Either list satisfies the check.
  valid_preacher_prefixes: ["Rev.", "Pastor", "Dr."]

  # Words that get a space inserted before them when they appear mid-title.
  title_spacing_words: ["강해"]

  # Scraped name -> canonical name. Placeholders; put real ones in config/.
  preacher_names:
    홍길동: 홍길동 목사
    김영희: 김영희 목사
