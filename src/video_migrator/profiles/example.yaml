# Example site profile — the shipped default, safe to publish.
#
# It is deliberately generic: a fictional host and placeholder names (홍길동 is
# the Korean equivalent of "John Doe"). Copy it to describe a real site:
#
#   cp src/video_migrator/profiles/example.yaml config/<yoursite>.yaml
#
# Anything under config/ is gitignored, so a real profile — which names real
# people — never enters the repository. The loader prefers ./config/<name>.yaml
# over this file, and $VIDEO_MIGRATOR_CONFIG over both.

site:
  board_url: https://example.com/bbs/board.php
  # Fills the {church} slot of an upload title. Left as a placeholder here: a
  # real congregation's name belongs in a profile under config/ or sites/.
  church: 예시교회

# How an upload is titled. The date leads because the destination platform
# stamps its own upload date on the video and will not take the original one, so
# this is the only place the date a recording belongs to reaches a viewer.
#
# title_template fills {church}, {date}, {service}, {title}, {quoted_title},
# {artist}, {bible_verse} and {short_verse}. A slot with nothing in it takes the
# separator before it with it, so a record with no preacher does not publish
# with a dangling " | ".
#
# {quoted_title} is the title in double quotes. Quote in the template instead
# and the closing quote belongs to whichever slot follows, so it disappears on
# any record that slot is empty for, leaving the title opened and never closed.
#
# {short_verse} abbreviates the book name the way a bulletin does — 요한복음
# 21:15-23 becomes 요 21:15-23. A book name that is not Korean, or not spelled
# the way the canon spells it, is left as it stands.
#
# date_format is a str.format template, not strftime: {month} is unpadded and
# {month:02d} pads, which reads the same on every platform. {short_year} is the
# last two digits. Year-first is both how Korean writes a date and how it sorts.
upload:
  title_template: "{date} | {service} | {title} | {artist}"
  date_format: "{year}.{month}.{day}"

# One entry per board. Order sets the CLI --board choices, and the first entry
# is the default. weekday is the day the service is held; a publish date one day
# later is treated as a late upload and pulled back onto it. Omit weekday for a
# board with no fixed day. creation_time is the time-of-day stamped into the media file;
# omit it to use midnight. Keep it quoted — bare 10:30:00 is a YAML integer.
#
# service_name fills the {service} slot of an upload title. service_template
# replaces it on a record naming which of the day's services it is, with {part}
# for the marker; a board holding one service a day needs only the name.
#
# valid_preacher_titles and valid_preacher_prefixes override the profile-wide
# lists below for a single board. Omit them to inherit; empty *both* to accept
# any name, which is what a board crediting a performer rather than a preacher
# wants. Empty is not the same as omitted here, and emptying one alone only
# narrows the check to the other.
boards:
  - name: early_morning_prayer
    genre: Sermon
    creation_time: "05:30:00"
    service_name: 새벽예배
  - name: sunday_sermon
    weekday: sunday
    genre: Sermon
    creation_time: "10:30:00"
    service_name: 주일예배
    service_template: "주일 {part} 예배"
  - name: wednesday_prayer
    weekday: wednesday
    genre: Sermon
    service_name: 수요기도회
  - name: friday_prayer
    weekday: friday
    genre: Sermon
    creation_time: "19:30:00"
    service_name: 금요성령집회
  - name: special_sermon
    genre: Sermon
    service_name: 특별집회
  - name: charisma_praise
    weekday: sunday
    genre: Praise
    service_name: 워십 찬양
    valid_preacher_titles: []
    valid_preacher_prefixes: []
  - name: votive_song
    weekday: sunday
    genre: Praise
    service_name: 봉헌송
    valid_preacher_titles: []
    valid_preacher_prefixes: []
  - name: choir_praise
    weekday: sunday
    genre: Praise
    service_name: 성가대 찬양
    valid_preacher_titles: []
    valid_preacher_prefixes: []

normalize:
  # A service part recorded at the end of a preacher name describes the service,
  # not the person: it is stripped from the name and prefixed to the title, so
  # "홍길동 선교사_2부설교" becomes preacher "홍길동 선교사" and title "2부 - ...".
  # The one capture group is the part.
  preacher_service_pattern: '[_\s]*([123]부|영상)(?:설교|예배)?\s*$'

  # Markers naming which service of the day a title belongs to. A single Sunday
  # yields a first service, a second, and sometimes a video of one, so a date on
  # its own does not identify a service.
  service_parts: ["1부", "2부", "3부", "영상"]

  # Regex -> replacement, applied to every scraped title in the order listed.
  # Python re.sub syntax: \1 is a capture group. Runs before title_spacing_words.
  #
  # Single-quote both sides. In double quotes YAML would eat the backslashes.
  title_replacements:
    '^\]\s+': ''                 # Remove a leading "] "
    '^([^\[]*\])': '[\1'         # Add the missing "[" when only "]" is present
    '^([^(]*\))': '(\1'          # Add the missing "(" when only ")" is present
    '\]제': '] 제'                # Put a space between "]" and 제
    '제\s*(\d+)\s*장': '제\1장'    # Close up "제 3 장" -> "제3장"

  # Regex -> replacement, applied to every scraped bible verse. Site typos in the
  # book name belong here; the generic tidying (unwrapping brackets, collapsing
  # spaces) is built in and runs afterwards.
  bible_verse_replacements:
    '\bJhon\b': 'John'          # the site misspells John in one record

  # A scraped artist name must carry one of these, or validation warns. Korean
  # titles follow the name; a trailing "(home church)" is ignored when looking.
  valid_preacher_titles: [" 목사", " 협동목사", " 선교사", " 장로", " 교수", " 총장", " M.D."]

  # English titles come before the name instead. Either list satisfies the check.
  valid_preacher_prefixes: ["Rev.", "Pastor", "Dr."]

  # Words that get a space inserted before them when they appear mid-title.
  title_spacing_words: ["강해"]

  # Scraped name -> canonical name. Placeholders; put real ones in config/.
  preacher_names:
    홍길동: 홍길동 목사
    김영희: 김영희 목사
