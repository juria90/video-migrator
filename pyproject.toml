[build-system]
requires = ["setuptools>=77.0"]  # >=77 for PEP 639 SPDX `license` / `license-files`
build-backend = "setuptools.build_meta"

[project]
name = "video-migrator"
version = "0.1.0"
description = "Migrate videos and their metadata between hosting platforms"
license = "MIT"
license-files = ["LICENSE"]
# Must match the pin in .python-version.
requires-python = ">=3.13,<3.14"
dependencies = [
    # For the api summarize backend (video_migrator.metadata.summarize).
    "anthropic",
    "beautifulsoup4",
    "curl-cffi",
    # Transcribing, for the summarize stage. A heavy install — it brings
    # CTranslate2 and onnxruntime with it — but the stage is part of the
    # pipeline rather than beside it, and a migration that cannot transcribe
    # loses the sermon's words permanently at release. Imported inside the
    # function that needs it, so that costs disk rather than start-up time.
    "faster-whisper",
    "google-api-python-client",
    # The CUDA runtime CTranslate2 opens by name. Not pulled in by
    # faster-whisper, and without them transcription fails at *inference* with
    # "Library libcublas.so.12 is not found" — after the model has loaded and
    # the GPU has shown activity, which is a thoroughly misleading way to fail.
    #
    # About 1.1 GB, and Linux-only: a machine without them falls back to the CPU
    # rather than failing (metadata.summarize._fall_back_to_cpu), but the CPU is
    # roughly ten times slower on this material, and the GPU is the whole reason
    # the stage fits inside time the pipeline is already spending.
    "nvidia-cublas-cu12; sys_platform == 'linux'",
    "nvidia-cudnn-cu12; sys_platform == 'linux'",
    "oauth2client",
    "pyyaml",
    "requests",
    "yt-dlp",
]

[project.optional-dependencies]
# Browser-driven download strategies (video_migrator.sources.aninamu_playwright)
browser = [
    "playwright",
]

# Dev tooling is a dependency group (PEP 735), not an extra: it is never
# shipped to consumers and `uv sync` installs it by default.
[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff",
    # Only tools/measure_artifacts.py needs an FFT, and it is run with numpy
    # supplied for the one command rather than depending on it. Its tests still
    # have to import it, so numpy is a test dependency — never a shipped one.
    "numpy",
]

[project.scripts]
video-migrator-list = "video_migrator.cli:main"
video-migrator-download = "video_migrator.sources.vimeo:main"
video-migrator-upload = "video_migrator.sinks.youtube:main"

[tool.setuptools]
packages = [
    "video_migrator",
    "video_migrator.metadata",
    "video_migrator.scrapers",
    "video_migrator.sinks",
    "video_migrator.sources",
    "video_migrator.utils",
]
package-dir = {"" = "src"}

# Site profiles are data, not code, but they ship inside the package so an
# installed CLI works without a checkout. See video_migrator/config.py.
[tool.setuptools.package-data]
video_migrator = ["profiles/*.yaml"]

[tool.pytest.ini_options]
# Both trees are collected by default: unit tests under tests/, and the
# doctests embedded in the package itself. Plain `pytest` therefore equals
# what the Makefile calls `test-all`.
testpaths = ["tests", "src/video_migrator"]
addopts = [
    "--doctest-modules",
    "--strict-markers",
    "--tb=short",
]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 120
target-version = "py313"

# Each directory under sites/ is one source site, cloned in as its own private
# repository with its own tooling and its own history. Git does not descend into
# a nested repository and tools/check_no_real_data.py cannot see inside one
# either, so this is where every other check in this project already stops; ruff
# crossing the boundary is the anomaly, not the rule.
#
# Left in, cloning a site makes that repository's code fail this one's lint —
# failures nobody here can fix without committing to somebody else's repository.
# A site lints itself, on its own terms. Anchored to the root, so an unrelated
# sites/ elsewhere in the tree is unaffected — the same rule .gitignore states.
extend-exclude = ["sites/*"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "SIM",   # flake8-simplify
]
ignore = [
    "E501",  # Line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["video_migrator"]
known-third-party = ["requests", "bs4"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
